limit_req_zone $binary_remote_addr zone=alphasplit_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    # Regex catch-all also matches requests made directly to the server IP.
    server_name ~^.*$;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
        proxy_buffering off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        limit_req zone=alphasplit_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
    }
}
