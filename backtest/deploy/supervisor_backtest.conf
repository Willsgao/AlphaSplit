; ============================================================
; 回测引擎 HTTP 接口服务 - supervisor 进程管理配置
; 用途：让 gunicorn 在后台常驻，崩溃自动拉起，随开机启动
;
; 安装 supervisor:
;   sudo apt-get install supervisor        # Ubuntu/Debian
;   pip install supervisor                 # 或 pip 方式
;
; 使用:
;   1) 按需修改下方 directory / command / user
;   2) 复制到 supervisor 配置目录:
;        sudo cp deploy/supervisor_backtest.conf /etc/supervisor/conf.d/
;      (RHEL/CentOS 路径: /etc/supervisord.d/)
;   3) 重新加载并启动:
;        sudo supervisorctl reread
;        sudo supervisorctl update
;        sudo supervisorctl status
;   4) 常用命令:
;        sudo supervisorctl start|stop|restart backtest
;        tail -f /var/log/backtest_err.log   # 看错误日志
; ============================================================

[program:backtest]
; 项目根目录（部署时改为实际路径；代码与数据同机，数据位于 ./data/processed）
directory=/opt/FinTech/backtest
; 启动命令：gunicorn 生产服务器
;   -c 使用 gunicorn.conf.py 配置
command=/opt/FinTech/backtest/venv/bin/gunicorn -c gunicorn.conf.py wsgi:app
; 用哪个用户跑（避免 root 权限，建议建专用用户 backtest）
user=backtest
; 开机自启
autostart=true
; 崩溃自动拉起
autorestart=true
; 失败重试次数
startretries=5
; 启动等待时间(秒)
startsecs=10
; 停止等待时间(秒)
stopwaitsecs=40

; 日志
stdout_logfile=/var/log/backtest_out.log
stderr_logfile=/var/log/backtest_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

; 环境变量（数据目录自动探测，若需显式指定再打开下面这行）
environment=FINBACK_BASE_DIR="/opt/FinTech"

; 进程数 = worker 数（默认 1，见 gunicorn.conf.py）
numprocs=1
